<!doctype html>
<html lang="en" data-theme="dark">
<head>

<title>ag</title>
<style>
:root {
  color-scheme: light;
  --page: #f6f6f4; --surface: #fcfcfb; --side: #f4f4f2; --side-rule: var(--ring); --ink: #1d1d1b; --ink-2: #55544f; --muted: #898781;
  --grid: #e4e3dc; --axis: #c3c2b7; --ring: rgba(20,20,18,0.09); --wash: rgba(20,20,18,0.04);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --t-call: #1f8a3b; --t-output: #74c487; --t-gatherer: #e8b600;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b; --selected: rgba(42,120,214,0.10);
  /* the Transcript view's terminal: the page's own surface, so the history is part of the page in either theme */
  --term-bg: var(--surface); --term-ink: #2b2a27; --term-dim: #6f6c65; --term-faint: #a09d95; --term-user: #efeee9; --term-ok: #2f9a4c;
  --term-err: #cf3a50; --term-run: #c08a00; --term-accent: #c4643f; --term-code: #f2f1ed; --term-rule: #e2e0d9; --term-bash: #c7307a;
  --term-add: rgba(47,154,76,.12); --term-del: rgba(207,58,80,.10); --term-add-ink: #1b6b34; --term-del-ink: #a5293d; --term-link: #2468c8;
  /* the Files view's markdown, coloured as the NumPy docs (the PyData theme) colour it: links, inline code */
  --md-link: #0a7d91; --md-code: #912583;
  /* code, coloured (the highlighter's hl-* classes, a command's output's a-* colours) */
  --hl-com: #6e6c66; --hl-kw: #7a35b0; --hl-str: #1d7a3a; --hl-num: #a3570a; --hl-fn: #1f5fb4; --hl-prop: #0a7489; --hl-meta: #8a6200;
  --hl-bg: color-mix(in srgb, var(--ink) 4%, var(--surface));
  --scroll: rgba(0,0,0,.16);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #111110; --surface: #1f1f1d; --side: #121211; --side-rule: rgba(255,255,255,0.14); --ink: #ecebe7; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --selected: rgba(57,135,229,0.16);
  --t-call: #2ea043; --t-output: #8fd19e; --t-gatherer: #f2cc3a;
  --term-bg: var(--surface); --term-ink: #e8e6e0; --term-dim: #8f8c84; --term-faint: #66635d; --term-user: #262522; --term-ok: #4eba65;
  --term-err: #ff6b80; --term-run: #e8b600; --term-accent: #d97757; --term-code: #222220; --term-rule: #2e2d2a; --term-bash: #fd5db1;
  --term-add: rgba(78,186,101,.16); --term-del: rgba(255,107,128,.16); --term-add-ink: #b6e8c0; --term-del-ink: #ffc2cb; --term-link: #7cb7ff;
  --md-link: #3fb1c5; --md-code: #f3c7ee;
  --hl-com: #9a978f; --hl-kw: #c7a2ff; --hl-str: #8fd19e; --hl-num: #f0a868; --hl-fn: #82b8ff; --hl-prop: #62c6d6; --hl-meta: #e3bd5f;
  --hl-bg: color-mix(in srgb, var(--ink) 4%, var(--surface));
  --scroll: rgba(255,255,255,.16);
  --buddy-edge: rgba(255,255,255,.28); --buddy-edge2: transparent;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #111110; --surface: #1f1f1d; --side: #121211; --side-rule: rgba(255,255,255,0.14); --ink: #ecebe7; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --selected: rgba(57,135,229,0.16);
  --t-call: #2ea043; --t-output: #8fd19e; --t-gatherer: #f2cc3a;
  --term-bg: var(--surface); --term-ink: #e8e6e0; --term-dim: #8f8c84; --term-faint: #66635d; --term-user: #262522; --term-ok: #4eba65;
  --term-err: #ff6b80; --term-run: #e8b600; --term-accent: #d97757; --term-code: #222220; --term-rule: #2e2d2a; --term-bash: #fd5db1;
  --term-add: rgba(78,186,101,.16); --term-del: rgba(255,107,128,.16); --term-add-ink: #b6e8c0; --term-del-ink: #ffc2cb; --term-link: #7cb7ff;
  --md-link: #3fb1c5; --md-code: #f3c7ee;
  --hl-com: #9a978f; --hl-kw: #c7a2ff; --hl-str: #8fd19e; --hl-num: #f0a868; --hl-fn: #82b8ff; --hl-prop: #62c6d6; --hl-meta: #e3bd5f;
  --hl-bg: color-mix(in srgb, var(--ink) 4%, var(--surface));
  --scroll: rgba(255,255,255,.16);
  --buddy-edge: rgba(255,255,255,.28); --buddy-edge2: transparent;
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  height: 100vh; display: flex; flex-direction: column; }
/* the page's name, at the top of the left column, as tall as the panes' heads beside it (--top-h: the top row) */
header { display: flex; flex-direction: column; justify-content: center; min-height: var(--top-h, 0px); border-bottom: 1px solid var(--ring); flex: none;
  position: relative; z-index: 30; }   /* above the page (the terminal's own layers reach 11), so its Settings panel is too */
header h1 { font-size: 16px; margin: 0; font-weight: 600; white-space: nowrap; }
/* the page's name, its home, and at the end of the line the settings' button: the page's state at a glance (its dot on
   the icon), and a panel with the dashboard's own details, opened under the column */
header .brand { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 8px 10px 8px 20px; }
header .home { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 0; }
header .about-btn { border: 0; background: none; padding: 5px; border-radius: 6px; font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; flex: none; }
header .about-btn:hover, header .about-btn[aria-expanded="true"] { color: var(--ink); background: var(--wash); }
header .about-btn .gear { position: relative; display: block; }
header .about-btn .gear svg { display: block; }
header .about-btn .gear .state-dot { position: absolute; right: -2px; bottom: -1px; box-shadow: 0 0 0 1.5px var(--side); }
.state-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--axis); display: inline-block; flex: none; }
.state-dot[data-state="live"] { background: var(--good); } .state-dot[data-state="error"] { background: var(--critical); }
.state-dot[data-state="paused"] { background: var(--warning); }
.about { position: absolute; top: calc(100% + 6px); left: 12px; z-index: 5; width: min(400px, calc(100vw - 32px)); max-height: calc(100vh - 90px); overflow: auto; background: var(--surface); border: 1px solid var(--ring);
  border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 12px 14px; font-size: 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; overflow-x: hidden; }
.about[hidden] { display: none; }
.about h4 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
.about .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.about .live { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); min-width: 0; overflow-wrap: anywhere; }
/* ag's own settings, at the top of the panel; the file itself in a dialog over the page */
.about h3 { margin: 0; font-size: 12px; font-weight: 600; color: var(--ink); border-bottom: 1px solid var(--ring); padding-bottom: 4px; }
.about .cfg, .about .cfg form, .about .cfg-more { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.about .cfg { gap: 12px; }
.about .cfg label, .about .cfg-label { display: grid; gap: 3px; color: var(--ink-2); }
.about .cfg input, .about .cfg select, .cfg-file textarea { font: inherit; font-size: 12px; color: var(--ink); background: var(--page);
  border: 1px solid var(--ring); border-radius: 6px; padding: 4px 8px; min-width: 0; }
.about .cfg .row input { flex: 1; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.about .cfg-more summary { cursor: pointer; color: var(--muted); font-size: 11px; }
.cfg-checks { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--ink); }
.cfg-checks label { display: inline-flex !important; align-items: center; gap: 4px; }
.cfg-note { color: var(--muted); font-size: 11px; white-space: pre-wrap; overflow-wrap: anywhere; }
.cfg-note.bad { color: var(--warning); } .cfg-note.err { color: var(--critical); }
.cfg-harnesses { display: grid; gap: 2px; font-size: 11px; color: var(--ink-2); }
.cfg-harnesses code, .about code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
.cfg-logins, .cfg-logins-pick { display: grid; gap: 6px; }
.cfg-logins-list { max-height: 180px; overflow: auto; display: grid; gap: 1px; padding: 4px 6px; border: 1px solid var(--ring); border-radius: 6px; background: var(--page); }
.cfg-logins-list label { display: flex !important; align-items: center; gap: 6px; color: var(--ink); font-size: 12px; cursor: pointer; }
.cfg-logins-list label .n { margin-left: auto; color: var(--muted); font-size: 11px; }
.cfg-path { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.cfg-flag { color: var(--warning); }
#cfg-edit { white-space: nowrap; flex: none; }
.cfg-file { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; }
.cfg-file[hidden] { display: none; }
.cfg-file-box { width: min(900px, 100%); height: min(85vh, 900px); background: var(--surface); border: 1px solid var(--ring); border-radius: 10px;
  padding: 12px 14px; display: grid; grid-template-rows: auto 1fr auto; gap: 8px; }
.cfg-file-box .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.cfg-file-box h3 { margin: 0; font-size: 14px; }
.cfg-file textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.45; resize: none; white-space: pre; tab-size: 4; }
.cfg-file .err { color: var(--critical); font-size: 12px; }
.about .servers { padding: 0; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
/* the selected actor's controls: how its history is shown, and its details */
/* they take the top row right of the actor's name, wrapping there when they need more */
.controls { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; justify-content: flex-end; flex: 0 1 auto; min-width: 0; }
.controls:empty { visibility: hidden; }
.controls .details-btn { display: inline-flex; align-items: center; padding: 5px 7px; }
/* a shell's Terminate (shellCard): a word beside its mark, so it is not taken for the pane's × */
.controls .terminate { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; font-size: 12.5px; color: var(--ink-2); }
.controls .terminate svg { display: block; }
.controls .terminate:hover:not(:disabled), .controls .terminate:focus-visible { color: var(--critical);
  border-color: color-mix(in srgb, var(--critical) 55%, var(--ring)); }
.pane-head .terminate { grid-area: views; }
.controls .details-btn svg { display: block; }
.controls .details-btn[aria-expanded="true"] { background: var(--selected); border-color: transparent; }
button { font: inherit; font-size: 12px; color: var(--ink); background: var(--surface); border: 1px solid var(--ring); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { background: var(--wash); }
/* the page is the screen's height: the agent list and the chat each scroll in their own place */
.layout { display: grid; grid-template-columns: min(var(--side-w, 320px), calc(100% - 260px)) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); flex: 1; min-height: 0; }
/* the left column: the page's name over the list, one rule down its side from the top of the page to the bottom */
.side { position: relative; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--side-rule); background: var(--side); }
/* its right edge, dragged, its width (--side-w; widthGrip); a double click: the width it had first */
.side-grip { position: absolute; top: 0; bottom: 0; right: -4px; width: 7px; cursor: col-resize; z-index: 5; touch-action: none; }
:is(.side-grip, .ed-col-grip):is(:hover, .on) { background: color-mix(in srgb, var(--axis) 50%, transparent); }
:root:is(.list-folded, .list-full) .side-grip { display: none; }
aside { border-right: 1px solid var(--side-rule); background: var(--side); padding: 12px 0; overflow-y: auto; }
#agents { flex: 1; min-height: 0; border-right: 0; }
aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 16px 6px; font-weight: 600; }
.gatherer { padding: 6px 0 8px; border-top: 1px solid var(--grid); }
/* its name, the hide button beside it (on hover), and at the right how many run and the start buttons; a
   click on the row, but on its buttons, opens or closes it */
.gatherer-row { display: flex; align-items: stretch; }
.gatherer-row:hover { background: var(--wash); }
.gatherer-row .name { flex: 0 1 auto; min-width: 0; padding: 6px 4px 6px 12px; display: flex; align-items: center; gap: 8px;
  border: 0; border-radius: 0; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.gatherer-row .fill { flex: 1 0 auto; display: flex; align-items: center; justify-content: flex-end; padding: 0 4px 0 8px; cursor: pointer; }
.gatherer-row .fill:last-child { padding-right: 16px; }
.gatherer-row .name:focus-visible { outline: 2px solid var(--axis); outline-offset: -2px; }
.gatherer-row .caret { display: inline-block; width: 10px; color: var(--muted); font-size: 10px; transition: transform .15s; }
.gatherer-row .name[aria-expanded="true"] .caret { transform: rotate(90deg); }
.gatherer-row .gname { font-size: 14px; font-weight: 600; letter-spacing: -.005em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.gatherer-row .count { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-2);
  background: var(--wash); border-radius: 999px; padding: 1px 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.gatherer-row .count i { width: 6px; height: 6px; border-radius: 50%; background: var(--good); display: inline-block; }
.gatherer-row .count.asking i { background: var(--warning); }
.gatherer-row .count.error i { background: var(--critical); }
.gatherer-row .act { border: 0; border-radius: 6px; background: none; color: var(--muted); padding: 0 8px; margin: 2px 0; line-height: 1;
  display: inline-flex; align-items: center; }
.gatherer-row .act:last-child { margin-right: 8px; }
.gatherer-row .act:hover { color: var(--ink); }
.gatherer-row .act.hide { opacity: 0; }
.gatherer-row:hover .act.hide, .gatherer-row .act.hide:focus-visible { opacity: 1; }
@media (hover: none) { .gatherer-row .act.hide { opacity: 1; } }
.agent-group { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 18px 2px 40px; }
button.agent-group { display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer; font-family: inherit; }
button.agent-group:hover { color: var(--ink-2); }
.agent { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; text-align: left; border: 0; border-radius: 8px;
  background: none; padding: 8px 10px; margin: 2px 8px; width: calc(100% - 16px); cursor: pointer; color: var(--ink); }
.agent:hover { background: var(--wash); }
.agent[aria-current="true"] { background: var(--selected); }
/* open in a pane other than the one in focus: the same, fainter */
.agent[data-open="true"] { background: color-mix(in srgb, var(--selected) 45%, transparent); }
.agent[data-open="true"]:hover { background: var(--selected); }
.agent .logo { width: 28px; height: 28px; margin-top: 1px; display: block; }
/* an actor's avatar, its harness's badge small at the corner: the avatar cut away around the badge, so
   whatever is behind the row (hovered, selected) shows between them */
.agent .avatar { position: relative; }
.agent .avatar img { width: 28px; height: 28px; display: block;
  -webkit-mask-image: radial-gradient(circle at 24.5px 24.5px, transparent 8px, #000 8.5px);
  mask-image: radial-gradient(circle at 24.5px 24.5px, transparent 8px, #000 8.5px); }
.agent .avatar .badge { position: absolute; right: -3px; bottom: -3px; width: 13px; height: 13px; display: block; }
/* a DocWriter's actor: DocWriter's quill at the other corner, the avatar cut away around both */
.agent .avatar.dw img {
  -webkit-mask-image: radial-gradient(circle at 24.5px 24.5px, transparent 8px, #000 8.5px), radial-gradient(circle at 3.5px 24.5px, transparent 8px, #000 8.5px);
  mask-image: radial-gradient(circle at 24.5px 24.5px, transparent 8px, #000 8.5px), radial-gradient(circle at 3.5px 24.5px, transparent 8px, #000 8.5px);
  -webkit-mask-composite: source-in; mask-composite: intersect; }
.agent .avatar .dw-badge { position: absolute; left: -3px; bottom: -3px; width: 13px; height: 13px; display: block; }
.agent .asked { font-size: 13px; line-height: 1.4; font-weight: 500; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden; overflow-wrap: anywhere; }
/* Claude Code's recap of the session, under what it was last asked: smaller, quieter, newer than the message */
.agent .recap { font-size: 12px; line-height: 1.4; color: var(--ink-2); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 3;
  -webkit-box-orient: vertical; overflow: hidden; }
.agent .recap .lbl { color: var(--muted); font-size: 10px; letter-spacing: .04em; text-transform: uppercase; margin-right: 5px; }
.agent .asked.none { color: var(--muted); font-weight: 400; font-style: italic; }
/* The session's name (codex's title for its thread), over what it was last asked, which then steps back */
.agent .name { font-size: 13px; line-height: 1.4; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; }
.agent .name + .asked { font-size: 12px; font-weight: 400; color: var(--ink-2); -webkit-line-clamp: 2; }
/* the one shown: its top line clicked names it */
.agent[aria-current="true"] .name[title], .agent[aria-current="true"] .asked[title] { cursor: text; }
.agent.renaming { cursor: default; }
.agent .name-box { display: block; width: 100%; box-sizing: border-box; font: inherit; font-size: 13px; font-weight: 600; line-height: 1.4;
  color: var(--ink); background: var(--surface); border: 1px solid var(--ring); border-radius: 5px; padding: 1px 6px; margin: -2px 0 -2px -7px;
  width: calc(100% + 7px); outline: none; }
.agent .name-box:focus { border-color: var(--ink-2); }
.agent .name-box::placeholder { color: var(--muted); font-weight: 400; }
.agent.renaming .name-box + .asked { font-size: 12px; font-weight: 400; color: var(--ink-2); -webkit-line-clamp: 2; }
.agent .meta { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.agent .meta .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--axis); flex: none; }
.agent .meta .dot.building { background: var(--warning); } .agent .meta .dot.failed { background: var(--critical); }
.agent .meta .dot.finished { background: var(--s1); }
/* its turn under way: the glyph turns, as Claude Code's does while it works */
.agent .meta .dot.running { width: 9px; height: auto; border-radius: 0; background: none; color: var(--good); font-size: 12px; line-height: 1; text-align: center; }
.agent .meta .dot.running::before { content: "✻"; animation: term-spin 1.2s steps(1) infinite; animation-delay: var(--spin-at, 0s); }
/* its turn waits on the user: a question asked, a plan to approve, in its terminal */
.agent .meta .dot.asking, .status.asking i { background: var(--warning); box-shadow: 0 0 0 2px color-mix(in srgb, var(--warning) 35%, transparent); }
/* its turn stopped on an error: its call to the model failed, and it gave up */
.agent .meta .dot.error, .status.error i { background: var(--critical); box-shadow: 0 0 0 2px color-mix(in srgb, var(--critical) 30%, transparent); }
/* its turn over, but something it started still runs: Running's colour, holding still */
.agent .meta .dot.background, .status.background i { background: var(--good); }
/* what it runs in the background, under its facts: how many, and what they are for */
.agent .bgline { font-size: 12px; color: var(--ink-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent .meta .dot.closed { background: none; box-shadow: inset 0 0 0 1.5px var(--axis); }
.hidden-list { border-top: 1px solid var(--grid); padding: 8px 0 4px; }
.hidden-list > summary { margin: 0; padding: 4px 16px; font-size: 12px; color: var(--muted); list-style: none; }
.hidden-list > summary::-webkit-details-marker { display: none; }
.hidden-list > summary:hover { color: var(--ink-2); }
.hidden-row { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 34px; font-size: 13px; }

  font-variant-numeric: tabular-nums; }
/* the glyph turning in a box of its own size: each of its shapes is as wide as it is, so nothing after it moves */
.monitor .status.running i { background: none; width: 12px; height: 12px; border-radius: 0; display: inline-flex; align-items: center;

/* in a narrow column: the actor at work smaller, and what it does under its label and time, not squeezed beside them */

/* Panes: the actors open side by side (Ctrl/Cmd+click in the list), each with its head -- the actor, its
   controls, a close -- the one in focus a shade darker; dividers between them to drag. The first is this
   page's own view; the others are the page again in a frame, each its own actor's (PANE) */
.panes { display: flex; min-width: 0; min-height: 0; position: relative; }
/* the column right of the list: the Editor (when open) above the panes */
.work { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.work > .panes { flex: 1 1 0; }
.pane-note { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10; max-width: calc(100% - 32px);
  background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 6px 12px; font-size: 12px; color: var(--ink-2);
  box-shadow: 0 4px 16px rgba(0,0,0,.12); }
.panes.resizing { cursor: col-resize; user-select: none; }

.pane-gutter::after { content: ""; position: absolute; inset: 0 2px; background: var(--ring); }

   the heads), so the rule under the row runs straight across. Alone, the head is one line: the actor's controls,
   at the right, as a header's; split, each pane's says whose it is and has its ×: who, the view's switch and Details,
   the ×, and the view's own tools (filters, switches) on a line under them -- a narrow pane's, who and the × on a
   line, the switch and Details under them, then the tools */
.pane-top { flex: none; display: flex; flex-direction: column; justify-content: center; min-height: var(--top-h, 0px); background: var(--surface);
  border-bottom: 1px solid var(--ring); }

  border: 1px solid color-mix(in srgb, var(--who) 55%, transparent); background: color-mix(in srgb, var(--who) 14%, transparent); }
button.ed-person { cursor: pointer; }
.ed-hint { color: var(--muted); }
.ed-auto { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); white-space: nowrap; cursor: pointer; }
.ed-auto input { margin: 0; }
.ed-wrap { border: 0; background: none; padding: 3px 5px; border-radius: 5px; color: var(--muted); cursor: pointer; display: inline-flex; }
.ed-wrap:hover { background: var(--wash); color: var(--ink); }
.ed-wrap.on { color: var(--s1); background: color-mix(in srgb, var(--s1) 14%, transparent); }
.ed-body { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--hl-bg); }
.ed-body .cm-editor { flex: 1; min-height: 0; background: var(--hl-bg); color: var(--ink); font-size: 12.5px; }
.ed-body .cm-editor.cm-focused { outline: none; }
.ed-body .cm-scroller { font-family: var(--mono); line-height: 1.55; }
.ed-body .cm-gutters { background: var(--hl-bg); color: var(--muted); border-right: 1px solid var(--grid); }
.ed-body .cm-activeLine { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.ed-body .cm-activeLineGutter { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }
.ed-body .cm-cursor, .ed-body .cm-dropCursor { border-left-color: var(--ink); }

.ed-body .cm-matchingBracket { background: color-mix(in srgb, var(--s1) 22%, transparent); outline: none; }
.ed-body .cm-searchMatch { background: color-mix(in srgb, var(--s4) 30%, transparent); outline: none; }
.ed-body .cm-panels { background: var(--surface); color: var(--ink); border-color: var(--grid); }
.ed-body .cm-textfield { background: var(--surface); color: var(--ink); border: 1px solid var(--ring); border-radius: 4px; }
.ed-body .cm-button { background: var(--wash); background-image: none; color: var(--ink); border: 1px solid var(--ring); border-radius: 4px; }
.ed-body .cm-tooltip { background: var(--surface); color: var(--ink); border: 1px solid var(--ring); }
/* LaTeX (assets/src/editor/latex.mjs): titles larger, math tinted, emphasis as it prints, braces and options faint */
.ed-body .hl-tex-h1 { font-size: 1.3em; font-weight: 700; } .ed-body .hl-tex-h2 { font-size: 1.15em; font-weight: 700; }
.ed-body .hl-tex-h3 { font-size: 1.04em; font-weight: 650; }
.ed-body .hl-tex-math { color: var(--hl-num); background: color-mix(in srgb, var(--hl-num) 10%, transparent); }
.ed-body .hl-tex-mcmd { font-weight: 600; }
.ed-body .hl-tex-em { font-style: italic; } .ed-body .hl-tex-ul { text-decoration: underline; text-underline-offset: 2px; }
.ed-body .hl-tex-tt { background: color-mix(in srgb, var(--ink) 7%, transparent); border-radius: 3px; }
.ed-body .hl-tex-url { color: var(--hl-fn); text-decoration: underline; text-underline-offset: 2px; }
.ed-body .hl-tex-verb { color: var(--hl-str); }
.ed-body .hl-tex-special { color: var(--hl-kw); font-weight: 600; }
.ed-body .hl-tex-opt { color: var(--muted); }
.ed-body .hl-tex-brace { color: var(--muted); font-weight: 400; font-style: normal; }
.ed-body .ed-disk { background: color-mix(in srgb, var(--who, var(--s2)) 26%, transparent); }
/* the conflict zone: the lines edited here since the file was opened, tinted very lightly */
.ed-body .ed-zone { background: color-mix(in srgb, var(--s1) 7%, transparent); }
.ed-zone-chip { display: inline-flex; align-items: center; gap: 2px; font-size: 11.5px; color: var(--ink-2); white-space: nowrap;
  padding: 1px 2px 1px 8px; border-radius: 9px; background: color-mix(in srgb, var(--s1) 13%, transparent); }
.ed-zone-chip button { border: 0; background: none; font: inherit; color: var(--s1); padding: 0 6px; cursor: pointer; border-radius: 7px; }
.ed-zone-chip button:hover { background: color-mix(in srgb, var(--s1) 16%, transparent); }
/* a conflict with the file on disk: the lines kept here, and under them the file's, with what to do about them */
.ed-body .ed-cf-mine { background: color-mix(in srgb, var(--warning) 14%, transparent); box-shadow: inset 3px 0 0 var(--warning); }
.ed-body .ed-cf { margin: 2px 0 6px; border: 1px solid color-mix(in srgb, var(--critical) 45%, var(--ring)); border-radius: 6px;
  background: var(--surface); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; white-space: normal;
  position: sticky; left: 0; max-width: min(100%, 900px); box-sizing: border-box; }
.ed-body .ed-cf-head .what { min-width: 0; overflow-wrap: anywhere; }
.ed-body .ed-cf-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 5px 8px; font-size: 12px; color: var(--ink-2);
  background: color-mix(in srgb, var(--critical) 8%, var(--surface)); }
.ed-body .ed-cf-head .grow { flex: 1; }
.ed-body .ed-cf-head button { font-size: 12px; padding: 2px 9px; }
.ed-body .ed-cf-label { padding: 5px 8px 0 12px; font-size: 11px; color: var(--muted);
  background: color-mix(in srgb, var(--critical) 6%, transparent); box-shadow: inset 3px 0 0 var(--critical); }
.ed-body .ed-cf-theirs { margin: 0; padding: 4px 8px 6px 12px; font: 12.5px/1.55 var(--mono); white-space: pre; overflow-x: auto;
  color: var(--ink); background: color-mix(in srgb, var(--critical) 6%, transparent); box-shadow: inset 3px 0 0 var(--critical); }
button.ed-status { border: 0; cursor: pointer; font: inherit; font-size: 11.5px; }
.ed-unmark { border: 0; background: none; color: var(--muted); font-size: 14px; line-height: 1; padding: 0 3px; margin-left: 3px; }
.ed-unmark:hover { color: var(--ink); background: var(--wash); }
.ed-row .mk.cf { font-size: 10.5px; font-weight: 700; color: #fff; background: var(--critical); border-radius: 7px; padding: 0 5px; line-height: 14px; }
.ed-body .ed-disk-line { box-shadow: inset 3px 0 0 var(--who, var(--s2)); }
/* an actor's lines from its branch, as long as it is not closed: tinted in its hue */
.ed-body .ed-agent { background: color-mix(in srgb, var(--who, var(--s2)) 9%, transparent); box-shadow: inset 2px 0 0 color-mix(in srgb, var(--who, var(--s2)) 70%, transparent); }
/* an actor's change from its branch, waiting for the reader: the box in its hue, not the conflict's red */
.ed-body .ed-cf.from-branch { border-color: color-mix(in srgb, var(--who, var(--s1)) 55%, var(--ring)); }
.ed-body .ed-cf.from-branch .ed-cf-head { background: color-mix(in srgb, var(--who, var(--s1)) 9%, var(--surface)); }
.ed-body .ed-cf.from-branch .ed-cf-label, .ed-body .ed-cf.from-branch .ed-cf-theirs {
  background: color-mix(in srgb, var(--who, var(--s1)) 7%, transparent); box-shadow: inset 3px 0 0 var(--who, var(--s1)); }
.ed-body .ed-cf-head .ed-avs img { width: 16px; height: 16px; margin: 0; }
.ed-body.wrap .ed-cf-theirs { white-space: pre-wrap; overflow-wrap: anywhere; overflow-x: hidden; }
/* within a box's change: the words it adds (in its lines), and those it takes out (in the lines here) */
.ed-body .ed-add { background: color-mix(in srgb, var(--good) 30%, transparent); border-radius: 2px; }
.ed-body .ed-cf-label .ed-add, .ed-body .ed-cf-label .ed-del { padding: 0 3px; }
.ed-body .ed-chg .ed-del + .ed-add { margin-left: 2px; }
.ed-body .ed-del { background: color-mix(in srgb, var(--critical) 24%, transparent); border-radius: 2px;
  text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--critical) 75%, transparent); }
.ed-body .ed-cf-mine.from-branch { background: color-mix(in srgb, var(--who, var(--s1)) 12%, transparent); box-shadow: inset 3px 0 0 var(--who, var(--s1)); }
.ed-brs:not(:empty) { padding: 0 8px 6px; }
.ed-row .mk.br { font-size: 10.5px; font-weight: 700; color: var(--warning); border: 1px solid color-mix(in srgb, var(--warning) 60%, transparent);
  border-radius: 7px; padding: 0 5px; line-height: 13px; }
/* above the tree: the actors on branches of the project shown, each with its changes waiting */
.ed-brs { display: grid; gap: 4px; }
.ed-br { border: 1px solid color-mix(in srgb, var(--who, var(--s1)) 40%, var(--ring)); border-radius: 6px; padding: 4px 6px;
  background: color-mix(in srgb, var(--who, var(--s1)) 5%, var(--page)); display: grid; gap: 3px; font-size: 12px; }
.ed-br .hd { display: flex; align-items: center; gap: 5px; min-width: 0; }
.ed-br .hd img, .ed-br .hd .ed-noav { width: 15px; height: 15px; border-radius: 50%; flex: none; }
.ed-br .hd .nm { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.ed-br .rt { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ed-br .rt code { font: 10.5px var(--mono); color: var(--ink-2); }
.ed-br .ap { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11.5px; cursor: pointer; }
.ed-br .ap input { margin: 0; }
.ed-br .f { display: flex; align-items: center; gap: 2px 4px; min-width: 0; flex-wrap: wrap; }
.ed-br .f > button.go { flex: 1 1 110px; min-width: 0; border: 0; background: none; padding: 1px 2px; text-align: left; font: 11.5px var(--mono);
  color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; border-radius: 4px; }
.ed-br .f > button.go:hover { background: var(--wash); }
.ed-br .f .k { color: var(--warning); font-size: 11px; white-space: nowrap; }
.ed-br .f .pick { flex: none; font-size: 11px; padding: 0 6px; }
.ed-br .none { color: var(--muted); font-size: 11.5px; }
@media (max-width: 760px) { .ed-tree { width: 140px; } }
/* the Files view: a turn's files, each as the agent saw it (files.py) */
.chat .chat-frame.files { overflow: hidden; display: flex; flex-direction: column; padding: 0; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  container: talk / size; }   /* its height the layout's: short (under the Editor, say), the actor at work said on one line */
.files .fl-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(220px, 320px) minmax(0, 1fr); }
.files .fl-grid.open { grid-template-columns: minmax(200px, 280px) minmax(0, 1fr) minmax(240px, 340px); }
/* --lh: a line of the conversation, which a reply's dot and its first line share */
/* the right column: the conversation, and under it what the agent waits on the user for (askingNote) */
.files .fl-right { min-width: 0; min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--ring); }
.files .fl-grid:not(.open) .fl-right { border-left: 0; }
.files .fl-right > .asking-note { flex-shrink: 1; min-height: 0; max-height: min(560px, 75%); }
.files .fl-talk { flex: 1; min-height: 0; position: relative; overflow: auto; padding: 6px 0 24px; font-size: 13.5px; --lh: 20px; line-height: var(--lh); }
.files .fl-grid:not(.open) .fl-talk { font-size: 14px; --lh: 21px; }
.files .fl-turn { margin: 2px 6px; padding: 7px 8px 9px 10px; }
.files .fl-grid:not(.folded) .fl-turn.on { box-shadow: inset 2px 0 0 var(--muted); }   /* the turn whose files and commands show: a grey bar */
/* the user's message: a band across the turn, at its head, in the colour the page gives the user (--s7) -- at the left,
   with the replies under it, however wide the page */
.files .fl-user { display: flex; gap: 8px; width: 100%; margin: 0; text-align: left;
  background: color-mix(in srgb, var(--s7) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--s7) 28%, transparent);
  border-radius: 8px; padding: 6px 12px; font: inherit; line-height: var(--lh); color: var(--ink); }
.files .fl-user .tx { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.files .fl-turn.on .fl-user .tx, .files .fl-turn.shown .fl-user .tx { -webkit-line-clamp: unset; }
/* before the latest, the message a button: a click shows or folds the turn's replies (folded: the turn closer to the next),
   its chevron at the end of its first line saying which. At the right of each message, clear of its band, its button for
   the turn's files and commands at the left. */
.files button.fl-user { cursor: pointer; }
.files button.fl-user:hover { background: color-mix(in srgb, var(--s7) 17%, var(--surface)); border-color: color-mix(in srgb, var(--s7) 55%, transparent); }
.files .fl-bash > button.fl-user.bash:hover { background: color-mix(in srgb, var(--term-bash) 7%, transparent); }
.files .fl-user > .tx { flex: 1 1 auto; }   /* its words wide as the band: the count and the chevron at its end */
/* the count and the chevron on its first line, however many lines it runs to: by the files button, the top row's */
.files .fl-user .fold-mark { flex: none; align-self: flex-start; height: var(--lh); display: grid; place-items: center; color: var(--muted); }
.files .fl-user .fl-count { flex: none; align-self: flex-start; font-size: 11.5px; line-height: var(--lh); color: var(--muted); white-space: nowrap;
  font-variant-numeric: tabular-nums; }
.files .fl-user .fold-mark svg { transition: transform .15s; }
.files .fl-user[aria-expanded="true"] .fold-mark svg { transform: rotate(90deg); }
.files .fl-turn.folded { padding-top: 3px; padding-bottom: 3px; }
.files .fl-head { position: relative; }
.files .fl-head > .fl-user, .files .fl-head > :is(.fl-bash, .fl-crew) > .fl-user { padding-right: 40px; }
.files .fl-btns { position: absolute; top: 3px; right: 4px; display: flex; }
.files .fl-btns button { width: 28px; height: calc(var(--lh) + 6px); padding: 0; border: 0; border-radius: 6px; background: none;
  color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.files .fl-btns button:hover { color: var(--ink); background: color-mix(in srgb, var(--s7) 22%, transparent); }
.files .fl-btns button[aria-pressed="true"] { color: var(--ink); background: color-mix(in srgb, var(--s7) 30%, transparent); }
/* what was written while the turn ran, sent to the agent: stacked on its first message, over it a little -- one turn.
   The ring, in the page's colour, keeps the edge of each it covers. */
.files :is(.fl-user, .fl-crew).joined { position: relative; margin-top: -7px; box-shadow: 0 0 0 2px var(--surface); }
/* written while it works, not sent yet: at the turn's end, faded, until Claude Code gives it to the agent */
.files .fl-pending { display: flex; flex-direction: column; gap: 2px; margin-top: 10px; }
.files .fl-pending .fl-user { opacity: .55; }
.files .fl-pending .lbl { color: var(--muted); font-size: 11.5px; margin-left: 4px; }
.files .fl-pending .to-term { font-size: inherit; padding: 0; border: 0; background: none; color: var(--term-link); text-decoration: underline; }
/* a turn begun, its message sent, that ag has not stored yet: in full, as the latest turn shows it, not yet one to pick */
.files .fl-turn.opened .fl-user .tx { -webkit-line-clamp: unset; }
.files .fl-user .tx.bang { font: .92em/var(--lh) var(--mono); }   /* a command the user ran with `!`, or typed as /name */
/* a bash band (bashBubble): a command the user ran with `!`, as a terminal shows it -- its `!` in bash mode's colour,
   the band edged in it -- and under a rule, in the same band, what it printed */
.files .fl-user.bash { background: var(--term-code); border-color: color-mix(in srgb, var(--term-bash) 45%, transparent); }
.files .fl-user .bash-mark { color: var(--term-bash); font-weight: 700; }
/* a message between the gatherer's actors (envelope, sentBubble): in a plain band, not the user's colour, its sender's
   avatar beside it (the receiver's, for one sent) and its name over its words */
.files .fl-user.crew, .files .fl-sent.crew { background: var(--surface); border: 1px solid var(--ring); }
.files button.fl-user.crew:hover { background: var(--wash); border-color: color-mix(in srgb, var(--ink) 16%, transparent); }
.files .fl-user.crew .tx { -webkit-line-clamp: unset; display: flex; gap: 10px; align-items: flex-start; }
.files .crew-face { width: 26px; height: 26px; flex: none; }
.files .crew-face.none { display: grid; place-items: center; color: var(--muted); background: var(--wash); border-radius: 50%; }
.files .crew-body { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.files .crew-from { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.files .crew-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.files .fl-sent { display: flex; gap: 10px; align-items: flex-start; margin: 6px 0 4px; padding: 6px 12px; border-radius: 8px;
  line-height: var(--lh); color: var(--ink); }
.files .fl-sent .crew-from { font-weight: 500; color: var(--muted); }
/* its words folded to their first three lines (crewFold; news, two), the rest under "Show all" -- shown only where
   there is more (.long). A turn's bubble, a button, is in a band (.fl-crew) with the toggle under it. */
.files .crew-fold:not(.open) .crew-text { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.files .crew-more { align-self: flex-start; margin: 0; padding: 0; background: none; border: 0; font: inherit; font-size: 12px;
  line-height: 18px; color: var(--muted); cursor: pointer; }
.files .crew-more:hover { color: var(--ink); text-decoration: underline; }
.files .crew-fold:not(.long) .crew-more { display: none; }
.files .fl-crew { display: flex; flex-direction: column; min-width: 0; background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; }
.files .fl-crew:has(> button.fl-user):hover { background: var(--wash); border-color: color-mix(in srgb, var(--ink) 16%, transparent); }
.files .fl-crew > .fl-user.crew, .files .fl-crew > button.fl-user.crew:hover { background: none; border: 0; border-radius: 8px; }
.files .fl-crew.long > .fl-user.crew { padding-bottom: 1px; }
.files .fl-crew > .crew-more { margin: 0 12px 5px 48px; }   /* under the words: the bubble's padding, the avatar, its gap */
.files .fl-sent .crew-more { margin-top: 1px; }
.files .fl-pending .fl-crew { opacity: .55; }
.files .fl-pending .fl-crew > .fl-user { opacity: 1; }
/* a watch's news: a quiet line, the actor it is about small beside it; what it was asked and said, folded to two lines
   (crewFold, as a message is) */
.files .fl-user.crew.update { background: none; border-color: transparent; padding-top: 3px; padding-bottom: 3px; }
.files button.fl-user.crew.update:hover { background: var(--wash); }
.files .fl-user.crew.update .crew-face { width: 18px; height: 18px; margin-top: 2px; }
.files .fl-user.crew.update .crew-from { font-weight: 500; }
.files .fl-user.crew.update .crew-how { font-weight: 400; color: var(--muted); }
.files .fl-user.crew.update .crew-text { font-size: 12.5px; color: var(--muted); }
.files .crew-fold.update:not(.open) .crew-text { -webkit-line-clamp: 2; }
.files .fl-crew.update { background: none; border-color: transparent; }
.files .fl-crew.update:has(> button.fl-user):hover { background: var(--wash); }
.files .fl-crew.update > .crew-more { margin: 0 12px 3px 40px; }   /* its avatar smaller */
.files .fl-bash { display: flex; flex-direction: column; min-width: 0; margin: 0;
  background: var(--term-code); border: 1px solid color-mix(in srgb, var(--term-bash) 45%, transparent); border-radius: 8px; overflow: hidden; }
.files .fl-bash > .fl-user.bash { border: 0; border-radius: 0; background: none; }
.files .fl-bash-out { margin: 0; padding: 6px 12px 8px; border-top: 1px solid var(--term-rule); max-height: 15em; overflow: auto;
  font: 12px/1.5 var(--mono); color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; background: none; }
.files .fl-bash-out.none { color: var(--muted); font-style: italic; }
.files .fl-reply { margin: 4px 0 0 2px; color: var(--ink-2); overflow-wrap: anywhere; }
.files .fl-reply > summary { display: flex; gap: 6px; margin: 0; font-size: inherit; cursor: pointer; list-style: none; }
.files .fl-reply > summary::-webkit-details-marker { display: none; }
.files .fl-reply > summary .dot { flex: none; color: var(--muted); font-size: 9px; line-height: var(--lh); }
.files .fl-reply > summary .first { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.files .fl-reply > summary:hover .first { color: var(--ink); }
.files .fl-reply[open] > summary .dot { color: var(--ink-2); } .files .fl-reply > summary:hover .dot { color: var(--s1); }
.files .fl-reply[open] > summary .first { display: none; }
.files .fl-reply > .md { margin: calc(-1 * var(--lh)) 0 6px 15px; }
/* a turn's last message, whole, in the page's ink; the ones before it smaller and quieter, each folded to a line,
   the latest few shown and the earlier behind "+ N earlier messages" (folded again by its "−") */
.files .fl-reply.main { margin-top: 6px; color: var(--ink); }
.files .fl-reply.main > summary .dot, .files .fl-reply.main[open] > summary .dot { color: var(--ink); }
.files .fl-minor { font-size: .9em; --lh: 18px; color: var(--muted); }
.files .fl-minor .fl-reply { color: var(--ink-2); }
.files .fl-minor .fl-reply:not([open]) > summary .first { color: var(--muted); }
.files .fl-minor .fl-reply > summary:hover .first { color: var(--ink-2); }
.files .fl-more { background: none; border: 0; border-radius: 4px; margin: 4px 0 0 2px; padding: 0 4px 0 0;
  font-size: .95em; color: var(--muted); cursor: pointer; }
.files .fl-more .sg { display: inline-block; width: 15px; text-align: left; }   /* + or −, under the messages' dots */
.files .fl-more:hover { background: none; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
/* above the turns drawn, how many are not yet: a pull up past the top draws them */
.files .fl-earlier { margin: 2px 6px 6px; padding: 2px 10px; font-size: 12px; color: var(--muted); text-align: center; }
/* a reply's markdown, coloured as the NumPy docs (the PyData theme) colour it, and no more: links teal, inline
   code magenta on grey, a table's header ruled in teal; headings, code and quotes in the text's own colours */
.files .md { min-width: 0; }
.files .md > :first-child { margin-top: 0; } .files .md > :last-child { margin-bottom: 0; }
.files .md p, .files .md ul, .files .md ol, .files .md pre, .files .md table, .files .md blockquote { margin: 0 0 10px; }
.files .md h1, .files .md h2, .files .md h3, .files .md h4, .files .md h5, .files .md h6 { color: var(--ink); font-weight: 650; line-height: 1.35; margin: 18px 0 6px; }
.files .md h1 { font-size: 1.35em; } .files .md h2 { font-size: 1.2em; } .files .md h3 { font-size: 1.07em; } .files .md h4, .files .md h5, .files .md h6 { font-size: 1em; }
.files .md > h1:first-child, .files .md > h2:first-child, .files .md > h3:first-child { line-height: var(--lh); }   /* beside the reply's dot */
.files .md strong { color: var(--ink); font-weight: 650; }
.files .md a { color: var(--md-link); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--md-link) 40%, transparent); text-underline-offset: 2px; }
.files .md a:hover { text-decoration-color: currentColor; }
.files .md ul, .files .md ol { padding-left: 22px; }
.files .md li { margin: 3px 0; } .files .md li > ul, .files .md li > ol { margin: 3px 0 0; }
.files .md li::marker { color: var(--muted); }
.files .md li:has(> input[type="checkbox"]) { list-style: none; margin-left: -20px; }
.files .md li > input[type="checkbox"] { margin: 0 6px 0 0; vertical-align: -2px; accent-color: var(--md-link); }
.files .md code { font: .88em var(--mono); color: var(--md-code); background: color-mix(in srgb, var(--ink) 6%, transparent);
  border: 1px solid var(--ring); padding: 0 4px; border-radius: 4px; overflow-wrap: anywhere; }
.files .md pre { background: color-mix(in srgb, var(--ink) 5%, var(--surface)); border: 1px solid var(--ring);
  border-radius: 4px; padding: 9px 12px; overflow-x: hidden; max-width: 100%; white-space: pre-wrap; tab-size: 4; }
.files .md pre code { font: 12.5px/1.55 var(--mono); color: var(--ink); background: none; border: 0; padding: 0; border-radius: 0; overflow-wrap: anywhere; }
/* a fenced block's line wrapped in the box, never scrolled sideways: its rest two columns in from where it begins */
.files .md .cf-l { padding-left: calc((var(--in) + 2) * 1ch); text-indent: calc((var(--in) + 2) * -1ch); }
.files .md blockquote { padding: 7px 12px; border-left: 4px solid var(--muted); border-radius: 4px;
  background: color-mix(in srgb, var(--ink) 5%, var(--surface)); color: var(--ink-2); }
.files .md hr { border: 0; border-top: 1px solid var(--axis); margin: 16px 0; }
.files .md table { display: block; width: max-content; max-width: 100%; overflow-x: auto; border-collapse: collapse; font-size: .93em; line-height: 1.45; }
.files .md th, .files .md td { border: 0; border-bottom: 1px solid var(--ring); padding: 5px 12px; text-align: left; vertical-align: top; white-space: normal; }
.files .md th + th, .files .md td + td { border-left: 1px solid var(--ring); }
.files .md thead tr { background: color-mix(in srgb, var(--ink) 5%, var(--surface)); }
.files .md th { color: var(--ink); font-weight: 650; border-bottom: 2px solid var(--md-link); }
.files .md tbody tr:nth-child(even) { background: var(--wash); }
.files .md th[align="right"], .files .md td[align="right"] { text-align: right; font-variant-numeric: tabular-nums; }
.files .md th[align="center"], .files .md td[align="center"] { text-align: center; }
.files .md img { max-width: 100%; }
.files .fl-none { margin: 4px 0 0 2px; color: var(--muted); font-style: italic; }
/* how a turn stopped short (stoppedLine): a line under it, as Claude Code draws it -- dim; an error in its colour */
.files .fl-stopped { display: flex; gap: 8px; margin: 4px 0 0 2px; color: var(--muted); overflow-wrap: anywhere; white-space: pre-wrap; }
.files .fl-stopped .lead { flex: none; }
.files .fl-stopped.error { color: var(--critical); }
/* a run of thinking: a message as the others are, "Thought:" before it, dim and in italics; opened, its words under the word */
.files .fl-reply.thought > summary .lbl { flex: none; color: var(--muted); font-style: italic; }
.files .fl-reply.thought > .md { margin-top: 0; }
/* the turn's latest call, while nothing was said or thought after it: a message as the others, its dot how it went; opened, its call and output */
.files .fl-reply.call > summary .dot.ok { color: var(--good); } .files .fl-reply.call > summary .dot.err { color: var(--critical); }
.files .fl-reply.call > summary .dot.run { color: var(--warning); animation: term-blink 1s steps(2) infinite; }
.files .fl-reply.call > summary .dot.wait { color: var(--warning); } .files .fl-reply.call > summary .dot.stop { color: var(--muted); }
.files .fl-reply.call > summary .lbl { flex: none; color: var(--muted); }
.files .fl-reply.call > summary .lbl.err { color: var(--critical); }
.files .fl-reply.call[open] > summary .first { display: block; }
/* Claude Code's notes among the messages (notedReply): a line, what it is in grey; opened, the rest under it */
.files .fl-reply.noted > summary .lbl { flex: none; color: var(--muted); }
.files .fl-reply.noted[open] > summary .first { display: block; }
.files .fl-reply.noted > .md, .files .fl-reply.noted > .fl-none { margin: 4px 0 6px 15px; }
.files .fl-status { display: flex; align-items: center; gap: 6px; margin: 6px 0 0 2px; color: var(--term-accent); font-size: .93em; }
.files .fl-status .spin { flex: none; }
.files .fl-status .tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* the actor at work, "Simple" (buddy()): its avatar's character out of its circle, small, moving as it would -- its
   data-motion, a move and an effect (avatars/README.md); and on the stage, while it thinks, the same effect laid over the
   character (.stage-box). Every animation runs on the page's clock (--t), so a redraw does not restart it. */
.buddy { position: relative; display: inline-block; width: 24px; height: 24px; flex: none; isolation: isolate; pointer-events: none; --t: 0s; }
/* a soft edge round it, so a white character stands out on a light page (--buddy-edge: the theme's) */
.buddy img { width: 100%; height: 100%; display: block; transform-origin: var(--o, 50% 50%);
  filter: drop-shadow(0 0 .7px var(--buddy-edge, rgba(0, 0, 0, .45))) drop-shadow(0 1px 1px var(--buddy-edge2, rgba(0, 0, 0, .12)));
  animation: var(--m, b-bob) var(--d, 2.4s) var(--e, ease-in-out) infinite var(--t); }
.buddy i { position: absolute; pointer-events: none; opacity: 0; font-style: normal; line-height: 1;
  animation: var(--f, none) var(--fd, 2.4s) var(--fe, ease-out) infinite; }
.buddy i:nth-of-type(1) { --k: 0; animation-delay: var(--t); }
.buddy i:nth-of-type(2) { --k: 1; animation-delay: calc(var(--t) - var(--fd, 2.4s) / 3); }
.buddy i:nth-of-type(3) { --k: 2; animation-delay: calc(var(--t) - var(--fd, 2.4s) * 2 / 3); }
.buddy.still img, .buddy.still i, .buddy.still::before { animation: none; }
.buddy.still { opacity: .55; filter: grayscale(.6); }
@media (prefers-reduced-motion: reduce) { .buddy img, .buddy i, .buddy::before { animation: none !important; } }

/* moves: the character (small, .buddy; or on its stage as it thinks, .me), about its middle, its foot (50% 100%) or the string it
   hangs from (50% 0) */
.m-bob { --m: b-bob; --d: 2.4s; }
@keyframes b-bob { 50% { transform: translateY(-2px); } }
.m-float { --m: b-float; --d: 3.6s; }
@keyframes b-float { 25% { transform: translateY(-1.5px) rotate(-3deg); } 75% { transform: translateY(.5px) rotate(3deg); } }
.m-hop { --m: b-hop; --d: 2.2s; --e: ease-out; --o: 50% 100%; }
@keyframes b-hop { 0%, 55%, 100% { transform: none; } 8% { transform: scale(1.08, .9); } 24% { transform: translateY(-5px) scale(.96, 1.05); }
  42% { transform: translateY(0) scale(1.07, .93); } }
.m-swim { --m: b-swim; --d: 3s; }
@keyframes b-swim { 0%, 100% { transform: translateX(-1.5px) rotate(4deg); } 50% { transform: translate(1.5px, -.5px) rotate(-4deg); } }
.m-glide { --m: b-glide; --d: 5s; }
@keyframes b-glide { 0%, 100% { transform: translateX(-2.5px) rotate(1deg); } 50% { transform: translateX(2.5px) rotate(-1deg); } }
.m-pulse { --m: b-pulse; --d: 2.6s; --o: 50% 100%; }
@keyframes b-pulse { 0%, 100% { transform: none; } 25% { transform: scale(1.08, .88); } 50% { transform: translateY(-3px) scale(.95, 1.06); }
  75% { transform: translateY(-1px); } }
.m-puff { --m: b-puff; --d: 3.2s; }
@keyframes b-puff { 0%, 30%, 100% { transform: none; } 45% { transform: scale(1.15); } 70% { transform: scale(1.13); } 85% { transform: scale(.98); } }
.m-waddle { --m: b-waddle; --d: 1.3s; --e: linear; --o: 50% 100%; }
@keyframes b-waddle { 0%, 100% { transform: rotate(-6deg); } 25% { transform: translateY(-1px); } 50% { transform: rotate(6deg); } 75% { transform: translateY(-1px); } }
.m-wobble { --m: b-wobble; --d: 3s; --o: 50% 100%; }
@keyframes b-wobble { 0%, 70%, 100% { transform: none; } 10% { transform: rotate(-11deg); } 25% { transform: rotate(8deg); } 40% { transform: rotate(-5deg); }
  55% { transform: rotate(2deg); } }
.m-swing { --m: b-swing; --d: 3s; --o: 50% 0; }
@keyframes b-swing { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
.m-sway { --m: b-sway; --d: 4s; --o: 50% 100%; }
@keyframes b-sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
.m-nod { --m: b-nod; --d: 2.8s; --o: 50% 100%; }
@keyframes b-nod { 0%, 60%, 100% { transform: none; } 70% { transform: translateY(1px) rotate(7deg); } 80% { transform: none; } 88% { transform: translateY(.5px) rotate(5deg); } }
.m-peck { --m: b-peck; --d: 2.2s; --o: 50% 100%; }
@keyframes b-peck { 0%, 50%, 100% { transform: none; } 10%, 30% { transform: rotate(-13deg); } 20%, 40% { transform: none; } }
.m-roll { --m: b-roll; --d: 3.6s; }
@keyframes b-roll { 0%, 100% { transform: translateX(-3px) rotate(-17deg); } 50% { transform: translateX(3px) rotate(17deg); } }
.m-fan { --m: b-fan; --d: 1.2s; --o: 50% 90%; }
@keyframes b-fan { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }
.m-beckon { --m: b-beckon; --d: 2.6s; --o: 50% 100%; }
@keyframes b-beckon { 0%, 45%, 100% { transform: none; } 10%, 30% { transform: translateY(-1px) rotate(-7deg); } 20% { transform: none; } }
.m-squish { --m: b-squish; --d: 2.4s; --o: 50% 100%; }
@keyframes b-squish { 0%, 100% { transform: none; } 30% { transform: scale(1.09, .91); } 60% { transform: scale(.96, 1.05); } 80% { transform: scale(1.02, .98); } }
.m-crawl { --m: b-crawl; --d: 6s; }
@keyframes b-crawl { 0%, 100% { transform: translateX(-2.5px); } 25%, 75% { transform: translateY(-.5px); } 50% { transform: translateX(2.5px); } }
.m-wag { --m: b-wag; --d: 2s; }
@keyframes b-wag { 0%, 50%, 100% { transform: none; } 10%, 30% { transform: rotate(6deg); } 20% { transform: rotate(-6deg); } 40% { transform: rotate(-3deg); } }
.m-patter { --m: b-patter; --d: 1.8s; --o: 50% 100%; }
@keyframes b-patter { 0%, 45%, 100% { transform: none; } 8%, 24% { transform: translateY(-1.5px) scale(1.02, .98); } 16%, 32% { transform: none; } }
.m-flutter { --m: b-flutter; --d: 2.6s; }
@keyframes b-flutter { 0%, 100% { transform: none; } 6% { transform: translateY(-2px); } 12% { transform: translateY(-1px); } 18% { transform: translateY(-3px); }
  24% { transform: translateY(-2px); } 30% { transform: translateY(-3.5px); } 55% { transform: translateY(-2.5px) rotate(-3deg); } 80% { transform: none; } }
.m-lookabout { --m: b-lookabout; --d: 4.4s; --o: 50% 100%; }
@keyframes b-lookabout { 0%, 100% { transform: none; } 15%, 75% { transform: translateY(-1.5px); } 30% { transform: translateY(-1.5px) rotate(-8deg); }
  55% { transform: translateY(-1.5px) rotate(8deg); } 90% { transform: none; } }
.m-flip { --m: b-flip; --d: 4s; }
@keyframes b-flip { 0%, 72% { transform: none; } 84% { transform: translateY(-4px) rotateY(180deg); } 96%, 100% { transform: rotateY(360deg); } }
.m-whisk { --m: b-whisk; --d: 2s; --e: linear; }
@keyframes b-whisk { 0%, 50%, 100% { transform: none; } 6%, 18%, 30%, 42% { transform: translateX(-1px); } 12%, 24%, 36% { transform: translateX(1px); } }
.m-wiggle { --m: b-wiggle; --d: 1.6s; }
@keyframes b-wiggle { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
.m-spin { --m: b-spin; --d: 10s; --e: linear; }
@keyframes b-spin { 100% { transform: rotate(360deg); } }

/* effects: three of each, a third of the way apart (or, a spout, together), around the avatar */
.buddy.f-steam { --f: b-steam; --fd: 2.4s; }
.buddy.f-steam i { top: -3px; left: calc(30% + var(--k) * 20%); width: 2px; height: 6px; border-radius: 2px; background: var(--muted); }
@keyframes b-steam { 0% { opacity: 0; transform: translateY(2px); } 30% { opacity: .55; } 60% { transform: translate(1.5px, -5px); }
  100% { opacity: 0; transform: translate(-.5px, -10px) scaleY(1.4); } }
.buddy.f-bubbles { --f: b-bubbles; --fd: 2.6s; }
.buddy.f-bubbles i { top: 15%; left: calc(15% + var(--k) * 30%); width: 4px; height: 4px; border: 1px solid #5fb0e6; border-radius: 50%; }
@keyframes b-bubbles { 0% { opacity: 0; transform: scale(.4); } 20% { opacity: .85; } 100% { opacity: 0; transform: translate(1px, -13px) scale(1); } }
.buddy.f-spout { --f: b-spout; --fd: 3.6s; }
.buddy.f-spout i { top: 0; left: 45%; width: 2.5px; height: 2.5px; border-radius: 50%; background: #5fb0e6; --x: calc((var(--k) - 1) * 4px);
  animation-delay: var(--t); }
@keyframes b-spout { 0%, 60% { opacity: 0; transform: none; } 66% { opacity: .9; } 80% { transform: translate(calc(var(--x) * .6), -8px); }
  100% { opacity: 0; transform: translate(var(--x), -3px); } }
.buddy.f-petals { --f: b-petals; --fd: 3.6s; --fe: linear; }
.buddy.f-petals i { top: -6px; left: calc(var(--k) * 35%); width: 4px; height: 3px; border-radius: 3px 0; background: #f6a5c8; }
@keyframes b-petals { 0% { opacity: 0; transform: none; } 15% { opacity: .9; } 50% { transform: translate(4px, 12px) rotate(120deg); }
  100% { opacity: 0; transform: translate(1px, 25px) rotate(260deg); } }
.buddy.f-snow { --f: b-snow; --fd: 3.4s; --fe: linear; }
.buddy.f-snow i { top: -5px; left: calc(5% + var(--k) * 40%); width: 2.5px; height: 2.5px; border-radius: 50%; background: #9cc3ef; }
@keyframes b-snow { 0% { opacity: 0; transform: none; } 15% { opacity: .95; } 50% { transform: translate(2px, 12px); } 100% { opacity: 0; transform: translate(-1px, 26px); } }
.buddy.f-sparkle { --f: b-sparkle; --fd: 2.7s; --fe: ease-in-out; }
.buddy.f-sparkle i { font-size: 7px; color: #f2b01e; }
.buddy.f-sparkle i::before { content: "✦"; }
.buddy.f-sparkle i:nth-of-type(1) { top: -4px; left: -4px; } .buddy.f-sparkle i:nth-of-type(2) { top: -5px; right: -4px; }
.buddy.f-sparkle i:nth-of-type(3) { bottom: 1px; right: -6px; }
@keyframes b-sparkle { 0%, 60%, 100% { opacity: 0; transform: scale(.3); } 30% { opacity: 1; transform: scale(1) rotate(45deg); } }
.buddy.f-notes { --f: b-notes; --fd: 3.3s; }
.buddy.f-notes i { top: -2px; left: 62%; font-size: 8px; color: var(--muted); }
.buddy.f-notes i::before { content: "♪"; } .buddy.f-notes i:nth-of-type(2)::before { content: "♫"; }
@keyframes b-notes { 0% { opacity: 0; transform: none; } 20% { opacity: .85; } 100% { opacity: 0; transform: translate(6px, -10px) rotate(15deg); } }
.buddy.f-breeze { --f: b-breeze; --fd: 1.8s; }
.buddy.f-breeze i { right: 100%; top: calc(28% + var(--k) * 20%); width: 6px; height: 1.2px; border-radius: 1px; background: var(--muted); transform-origin: right; }
@keyframes b-breeze { 0% { opacity: 0; transform: scaleX(.3); } 30% { opacity: .7; } 100% { opacity: 0; transform: translateX(-6px) scaleX(1); } }
.buddy.f-ripple { --f: b-ripple; --fd: 3s; }
.buddy.f-ripple i { left: 50%; bottom: -3px; width: 20px; height: 5px; margin-left: -10px; border: 1px solid #6aaee0; border-radius: 50%; }
@keyframes b-ripple { 0% { opacity: .75; transform: scale(.35); } 100% { opacity: 0; transform: scale(1.35); } }
.buddy.f-glow::before { content: ""; position: absolute; inset: -5px; z-index: -1; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 166, 64, .6), transparent 68%); animation: b-glow 2.8s ease-in-out infinite var(--t); }
@keyframes b-glow { 0%, 100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.08); } }

/* The actor at work in the Chat view (atWork): its avatar's character out of its circle, acting out what its turn is doing
   (s-<kind>, work.py's) with the same tool whatever the character, so a tool always means the same thing; reacting to how a
   call ended, once (r-*); between calls, thinking, moving as its character does (its avatar_motion's move: .me.m-<move>).
   Its loops run on the page's clock (--t; its action's, --a, slowing to a stop as a call ends), a reaction from when it
   began (--r), so a redraw restarts neither. */
/* what it is doing in words, at the end of the latest turn; the actor at work under it, in line with its words */
.files .fl-working { margin: 6px 0 0 2px; font-size: .93em; min-width: 0; }
.files .fl-working > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.files .fl-working .now { color: var(--term-accent); }
/* when it last did something, and how long the turn has run: counting, dim, above the words */
.files .fl-working .fl-times { color: var(--muted); font-size: .86em; opacity: .8; font-variant-numeric: tabular-nums; }
.files .fl-working > .fl-mini { display: none; }
.files .fl-working.fl-finished { display: none; }   /* short of height only */
.files .fl-mini img { display: block; width: 1.3em; height: 1.3em; }
.files .fl-talk > .fl-status { margin: 4px 6px 0 8px; }
/* short of height: the actor at work on one line -- its avatar small, as tall as the words, "Working…", then the times --
   in place of the two lines and the avatar under them (or the avatar done). Those put away, not display: none: laying the
   Chat out again -- the message box growing as it is typed in, say -- Chrome tries the frame at no height and at its
   least on the way, the query true there for that moment; display: none would restart their animations at every key,
   the avatar done growing in again. Hidden, not content-visibility: hidden: flipped within every layout, that set Chrome
   numbering each numbered list (an <ol> in a reply) again, which asked for another layout -- each read of a size laid the
   whole Chat out anew (a redraw of 40 turns 4-5 times as long), and with some replies it never settled, the Chat laid out
   again and again while nothing happened */
@container talk (max-height: 420px) {
  .files .fl-working { display: flex; align-items: center; gap: 6px; }
  .files .fl-working > .fl-mini { display: inline-flex; flex: none; order: 0; color: var(--term-accent); }
  .files .fl-working > .now { order: 1; flex: none; }
  .files .fl-working > .fl-times { order: 2; flex: 0 1 auto; }
  .files .fl-working > .fl-times::before { content: "· "; }
  .files .fl-working.fl-finished { display: flex; }
  .files .fl-talk > .fl-status, .files .fl-talk > .fl-done { visibility: hidden; overflow: hidden; height: 0; margin: 0; } }
.files .fl-status svg.stage { height: 60px; margin: 0 0 0 -4px; }
.files .fl-status .spin { font-size: 1.4em; }
.files .fl-status > .buddy { margin: 2px 0 0 4px; }
/* the turn over: the actor small, done -- a check at its corner, still; grown in if the page saw it end (--r) */
.files .fl-done { display: flex; align-items: center; margin: 6px 6px 0 17px; }
:is(.files .fl-done, .mini-st) .done { position: relative; display: inline-flex; flex: none; transform-origin: 30% 90%;
  animation: w-arrive .5s cubic-bezier(.3, 1.3, .5, 1) var(--r, -60s) 1 both; }
:is(.files .fl-done, .mini-st) .done img { width: 24px; height: 24px; display: block; filter: drop-shadow(0 0 .6px var(--buddy-edge, rgba(0, 0, 0, .45))); }
:is(.files .fl-done, .mini-st) .done .ok { position: absolute; right: -4px; bottom: -2px; width: 12px; height: 12px; border-radius: 50%; background: #22a55a;
  box-shadow: 0 0 0 1.5px var(--surface); display: grid; place-items: center; }
:is(.files .fl-done, .mini-st) .done .ok svg { width: 8px; height: 8px; }
/* before its first message: the actor waving hello (greeting()), in the middle of the conversation's space -- under the
   message sent, while it waits to reach the agent */
.files .fl-talk.hi { display: flex; flex-direction: column; }
.files .fl-hello { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px; color: var(--muted);
  text-align: center; }
.files .fl-hello svg.stage { height: 84px; }
.files .fl-hello > .buddy { width: 40px; height: 40px; }
/* what it says (helloLine()): a haiku's lines in italics */
.files .fl-say { max-width: 340px; }
.files .fl-say.verse { font-style: italic; }
@container talk (max-height: 420px) { .files .fl-hello svg.stage { height: 48px; } }
svg.stage { height: 32px; width: auto; flex: none; overflow: visible; --t: 0s; --a: 0s; --r: -60s; --x: -60s; --y: -60s; --z: -60s; --p: -60s;
  --b: -60s; --dot: #f97316; --metal: light-dark(#94a3b8, #8a94a3); }

  content-visibility: auto; contain-intrinsic-size: auto 46px; }

.hist .h-row:not(.nested)::before { content: ""; position: absolute; left: 21px; top: 12px; width: 7px; height: 7px; border-radius: 50%; z-index: 1;

.hist .h-row.current::before { background: var(--good); box-shadow: none; }
.hist .h-row.on:not(.nested)::before { background: var(--s1); box-shadow: none; }

.hist .h-full { user-select: text; cursor: text; }

.hist .h-tw:hover { color: var(--ink); background: none; }
.hist .h-main { min-width: 0; padding-right: 4px; }
.hist .h-label { font-size: 13px; line-height: 1.45; color: var(--ink); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2;

.hist .h-row.nested .h-label { font-size: 12.5px; }
.hist .h-row.message .h-label { color: var(--ink-2); }
.hist .h-row.open .h-label { -webkit-line-clamp: 6; }

.hist .h-kind { display: inline-block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--good); margin-right: 6px; }
.hist .h-main.keyed { border-left: 3px solid var(--key); padding-left: 9px; }   /* a message's type, as the Messages view keys it */
.hist .h-badge { display: inline-block; font-size: 10px; font-weight: 600; color: var(--s1); border: 1px solid currentColor; border-radius: 999px; padding: 0 6px; margin-right: 6px; line-height: 15px; }
.hist .h-sub { font-size: 12.5px; line-height: 1.45; color: var(--ink-2); margin-top: 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.hist .h-hit { font-size: 12px; color: var(--ink-2); margin-top: 3px; overflow-wrap: anywhere; }
.hist mark { background: color-mix(in srgb, var(--s4) 35%, transparent); color: inherit; border-radius: 2px; padding: 0 1px; }
.hist .h-meta { position: absolute; right: 14px; top: 8px; padding: 0 0 0 22px; font-size: 11px; line-height: 19px; color: var(--muted); white-space: nowrap;
  font-variant-numeric: tabular-nums; background: linear-gradient(to right, transparent, var(--row-bg) 18px); opacity: 0; pointer-events: none; transition: opacity .12s; }

.hist .h-full { grid-column: 2 / -1; margin: 6px 0 2px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere;
  color: var(--ink-2); background: var(--page); border: 1px solid var(--grid); border-radius: 6px; padding: 8px 10px; max-height: 360px; overflow: auto; }

.hist .h-act textarea { width: 100%; min-height: 38px; max-height: 30vh; resize: vertical; font: inherit; font-size: 13px; color: var(--ink); background: var(--page);
  border: 1px solid var(--ring); border-radius: 6px; padding: 6px 8px; field-sizing: content; }

.hist .h-rec .chip-k.summary { background: var(--s1); } .hist .h-rec .chip-k.memory { background: var(--s7); } .hist .h-rec .chip-k.skill { background: var(--s3); }
.hist .h-rec .chip-k.agents, .hist .h-rec .chip-k.claude { background: var(--s2); text-transform: none; letter-spacing: 0; }

  background: var(--page); border: 1px solid var(--ring); border-radius: 6px; padding: 4px 8px; }

.hist .h-save .file pre { margin: 0; padding: 6px 8px; border-top: 1px solid var(--grid); font: 11.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
  white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow: auto; color: var(--ink-2); }
.hist .h-save .err { color: var(--critical); } .hist .h-save .ok { color: var(--good); }

.hist .h-rec .saved { font-size: 11.5px; color: var(--ink-2); padding: 0 12px 8px; overflow-wrap: anywhere; }
.hist .h-rec .saved b { color: var(--good); font-weight: 600; }
.hist .h-rec .body { border-top: 1px solid var(--grid); padding: 8px 12px 10px; font-size: 13px; overflow-wrap: anywhere; }
.hist .h-rec .body .md > :first-child { margin-top: 0; } .hist .h-rec .body .md > :last-child { margin-bottom: 0; }
.hist .h-rec .body .md pre { overflow: auto; background: var(--page); border-radius: 6px; padding: 6px 8px; font-size: 12px; }

.hist .h-rec .body .md h1 { font-size: 16px; } .hist .h-rec .body .md h2 { font-size: 14px; } .hist .h-rec .body .md h3, .hist .h-rec .body .md h4 { font-size: 13px; }
.hist .h-rec .body .md h1, .hist .h-rec .body .md h2, .hist .h-rec .body .md h3 { margin: 12px 0 4px; }
.hist .h-rec .body .md ul, .hist .h-rec .body .md ol { padding-left: 20px; }
.hist .h-rec .front { margin: 0 0 8px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; background: var(--page);
  border: 1px solid var(--grid); border-radius: 6px; padding: 6px 8px; color: var(--ink-2); }
.hist .h-rec .acts { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 12px 10px; }
.hist .h-rec .fail { color: var(--critical); font-size: 12px; white-space: pre-wrap; }
.hist .h-rec .working { color: var(--ink-2); font-size: 12px; display: flex; align-items: center; gap: 6px; }

.hist .ticking { font-variant-numeric: tabular-nums; color: var(--muted); }

<body>
<div class="layout">
  <!-- the left column: the page's name over the list of actors; the top row, its name and each pane's head -->
  <div class="side">
    <header>
      <div class="brand">
        <h1>ag</h1>
        <div class="home" id="home"></div>
        <div class="about-wrap">
          <button class="about-btn" id="about-btn" type="button" aria-expanded="false" aria-controls="about" aria-label="Settings" title="Settings: ag's, and this page's">
            <span class="cfg-flag" id="cfg-flag" hidden>No model set</span><span class="gear"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"
              fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4.5h6.75M12.25 4.5H14M2 11.5h1.75M7.25 11.5H14"/>
              <circle cx="10.5" cy="4.5" r="1.75"/><circle cx="5.5" cy="11.5" r="1.75"/></svg><span class="state-dot" id="state-dot"></span></span></button>
          <div class="about" id="about" hidden>
            <section class="cfg" id="cfg" hidden>
              <h3>ag</h3>
              <form id="cfg-model"><h4>Gatherer model</h4>
                <div class="row"><input id="cfg-model-name" list="cfg-models" placeholder="claude-code/sonnet" spellcheck="false" autocomplete="off" aria-label="Gatherer model">
                  <button class="primary" type="submit">Set</button></div>
                <datalist id="cfg-models"><option value="claude-code/sonnet"><option value="claude-code/haiku"><option value="claude-code/opus">
                  <option value="codex/gpt-5-mini"><option value="gemini/gemini-3.8-flash"></datalist>
                <details class="cfg-more"><summary>API base and key (LiteLLM models only)</summary>
                  <label>API base<input id="cfg-api-base" placeholder="the provider's own API" spellcheck="false"></label>
                  <label>Key variable<input id="cfg-key-env" placeholder="the provider's own, e.g. GEMINI_API_KEY" spellcheck="false"></label></details>
                <div class="cfg-note" id="cfg-model-note"></div></form>
              <form id="cfg-defaults"><h4>Gatherer defaults</h4>
                <label>Policy<select id="cfg-policy"></select></label>
                <div class="cfg-label">Pollers<span class="cfg-checks" id="cfg-pollers"></span></div>
                <label title="[cli] gatherer: where `ag claude` files a run that names no --gatherer (&quot;.&quot;: one per session)"><span>Gatherer for <code>ag &lt;harness&gt;</code> runs</span><input id="cfg-gatherer" spellcheck="false" placeholder="default"></label>
                <div class="row"><span class="cfg-note" id="cfg-defaults-note"></span><button type="submit">Save</button></div></form>
              <div><h4>Harnesses</h4><div class="cfg-harnesses" id="cfg-harnesses"></div></div>
              <div class="cfg-logins" id="cfg-logins" hidden><h4>Browser logins</h4>
                <div class="cfg-note" id="cfg-logins-note"></div>
                <div class="row"><span></span><button type="button" id="cfg-logins-read">Import from your Chrome…</button></div>
                <div class="cfg-logins-pick" id="cfg-logins-pick" hidden>
                  <input id="cfg-logins-filter" placeholder="Filter sites" spellcheck="false" autocomplete="off" aria-label="Filter sites">
                  <div class="cfg-logins-list" id="cfg-logins-list" role="group" aria-label="Sites"></div>
                  <div class="row"><span class="cfg-note" id="cfg-logins-count"></span>

              <div class="row"><span class="cfg-path" id="cfg-path"></span><button type="button" id="cfg-edit">Edit config.toml…</button></div>
              <h3>This page</h3>

            <div><h4>Updates</h4>
              <div class="row"><span class="live"><span class="state-dot" id="state-dot-2"></span><span id="live" role="status"></span></span>
                <button id="pause" type="button" title="Stop updating this page; the agents and the server go on">Pause</button></div></div>

                <button type="button" data-theme-pick="system">System</button><button type="button" data-theme-pick="light">Light</button><button type="button" data-theme-pick="dark">Dark</button></div></div>
            <div><h4>Avatar at work</h4>

<script>
"use strict";
const SNAPSHOT = /*SNAPSHOT*/null;
// In a pane: the page again, in a frame of the page around it (panes, below), showing one actor -- the URL's
// (?pane=1&gatherer=G&channel=C&view=V) -- with no list or header of its own. PANE is the page around it:
// it streams for the frame, and keeps which actor and view it shows.
const PANE_URL = new URLSearchParams(location.search);
const PANE = (() => {
  if (SNAPSHOT || !PANE_URL.has("pane") || window.parent === window) return null;
  try { return window.parent.agPanes || null; } catch (e) { return null; }
})();
if (PANE) document.documentElement.classList.add("pane-mode");
// The server pushes each change (/api/stream); this is only how often the "ago" texts are redrawn.
const AGO_MS = 30000;
// What the page calls each kind the data names (data.py's group names stay as they are).
const LABELS = { "ag's sections": "Summarized history", "Recent history": "Recent raw history", "Other agents' requests": "Other actors' requests" };
const label = (group) => LABELS[group] || group;
const PREAMBLE = "Harness preamble", NOT_COUNTED = "Not counted by ag";
// the provider's count beyond ag's, shown only when the gap is more than this: smaller is tokenizer noise
const NOT_COUNTED_MIN = 50000;
const uncounted = (n) => n > NOT_COUNTED_MIN ? n : 0;
const GROUP_ORDER = [PREAMBLE, "Recent history", "ag's sections", "Kept from before the cut", "File-change notices", "Other agents' requests", "Stream messages", NOT_COUNTED];
const DETAILS_KEY = "ag-dashboard-details";   // which side of the details panel the reader last chose
let state = { home: null, selected: null, agent: null, readId: null, context: null, paused: false, stream: null,
  tx: null,             // the transcript feed's events, loaded as they come: {key, items, pending, first_row, last_row, earlier}
  details: !!SNAPSHOT,  // the details panel open beside the chat: at first in a snapshot, which has no conversation
  detailsTab: (() => { try { const v = localStorage.getItem(DETAILS_KEY); return v === "gatherer" || v === "context" ? v : "actor"; } catch (e) { return "actor"; } })(),
  chat: null,           // the history feed's messages: {key, items (stored, append-only), pending, last_row}
  adding: null,         // the form open in the agent list: {gatherer: ""} a new gatherer's, {gatherer: G} a new session's in G
  renaming: null };     // the actor being named in the list: {g, c, value (as typed so far), was (its name before)}
if (PANE) state.selected = [PANE_URL.get("gatherer") || "", PANE_URL.get("channel") || ""];
// The actors open side by side (panes, below): this page's own view (`here`, its actor state.selected), the
// first, and the others (`others`), each the page in a frame; `focus` the one a click in the list shows its
// actor in. `home` and `actors`: the stream's last home and each other pane's last agent, as sent (JSON), for
// a frame that is not ready when they come. `checked`: the panes kept in this browser opened again.
const PANES_KEY = "ag-dashboard-panes", MAX_PANES = 4, MIN_PANE = 260;
const panes = { here: null, others: [], focus: null, home: null, actors: new Map(), checked: false, top: null };

// ------------------------------------------------------------------ helpers
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v;

function lineChart(host, { reads, series, height = 220, rebuilds = true, step = false, onPick, picked }) {

  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img" });
  for (let v = 0; v <= ymax + 1e-9; v += stepY) {
    svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
    const t = svgEl("text", { x: m.l - 6, y: Y(v) + 4, "text-anchor": "end" }); t.textContent = compact(v); svg.append(t);
  }
  const days = (x1 - x0) > 86400;
  const ticks = Math.max(2, Math.min(6, Math.floor((W - m.l - m.r) / 110)));
  for (let i = 0; i <= ticks; i++) {
    const t = x0 + (x1 - x0) * i / ticks;
    const lab = svgEl("text", { x: X(t), y: H - 8, "text-anchor": i === 0 ? "start" : i === ticks ? "end" : "middle" });
    lab.textContent = axisTime(t, days, (x1 - x0) < 600); svg.append(lab);
  }
