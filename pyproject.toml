[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "actor-gatherer"
version = "0.1.0"
description = "The Actor-Gatherer framework: a context management framework for AI agents."
readme = "README.md"
authors = [{ name = "Sepanta Zeighami" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["agents", "context management", "coding agents", "claude code", "codex", "opencode", "pi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
]
dependencies = [
    "aiohttp>=3.9",          # the hook server (Codex, Claude Code)
    "backports.zstd>=1.0; python_version < '3.14'",   # for aiohttp: Codex on a ChatGPT login sends zstd requests
    "tiktoken>=0.7",         # counting tokens
    "litellm>=1.60",         # every LLM call the policies make, to any provider
    "pycrdt>=0.12",          # the dashboard's Editor panel: a file edited by several at once (Yjs's CRDT, ag_dashboard/editor.py)
    "watchdog>=4; sys_platform == 'darwin'",   # the files a session's calls change, as macOS reports them (FSEvents);
                                               # Linux's inotify needs nothing (ag/integrations/tools/file_touches/watch.py)
]

[project.optional-dependencies]
codex = ["openai-codex>=0.163"]   # codex/<model> as the Gatherer's LLM, on your Codex login (CLIClient)

[project.urls]
Homepage = "https://ucbepic.github.io/actor-gatherer/"
Documentation = "https://ucbepic.github.io/actor-gatherer/docs.html"
Source = "https://github.com/ucbepic/actor-gatherer"

[project.scripts]
ag = "ag.cli.main:main"   # run a harness with the context manager
ag-dashboard = "ag_dashboard.__main__:main"   # the dashboard alone (also `ag dashboard`)

[tool.setuptools.packages.find]
include = ["ag*", "harness_kit*"]

[tool.setuptools.package-data]
# what runs from the installed package besides Python: ag's harness entries, and the TypeScript
# plugins (Pi, OpenCode) with the shared harness-side code they import; each harness's mark; and the
# dashboard's page and its actors' avatars and what they say
ag = ["cli/harnesses.toml", "integrations/**/*.ts"]
harness_kit = ["marks/*.svg"]
ag_dashboard = ["page.html", "gatherer_agent.md", "vendor/*", "examples/*.js", "avatars/*/*.svg", "avatars/hello.toml"]
