<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ag</title>
</head>
<body>
<div class="layout">
  <!-- the left column: the page's name over the list of actors; the top row, its name and each pane's head -->
  <div class="side">
    <header>
      <div class="brand">
        <h1>ag</h1>
        <div class="home" id="home"></div>
        <div class="about-wrap">
          <button class="about-btn" id="about-btn" type="button" aria-expanded="false" aria-controls="about" aria-label="Settings" title="Settings: ag's, and this page's">
            <span class="cfg-flag" id="cfg-flag" hidden>No model set</span><span class="gear"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"
              fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4.5h6.75M12.25 4.5H14M2 11.5h1.75M7.25 11.5H14"/>
              <circle cx="10.5" cy="4.5" r="1.75"/><circle cx="5.5" cy="11.5" r="1.75"/></svg><span class="state-dot" id="state-dot"></span></span></button>
          <div class="about" id="about" hidden>
            <section class="cfg" id="cfg" hidden></section>
            <div><h4>Updates</h4>
              <div class="row"><span class="live"><span class="state-dot" id="state-dot-2"></span><span id="live" role="status"></span></span>
                <button id="pause" type="button" title="Stop updating this page; the agents and the server go on">Pause</button></div></div>
            <div><h4>Theme</h4>
              <div class="views" id="theme" role="group" aria-label="Theme">
                <button type="button" data-theme-pick="system">System</button><button type="button" data-theme-pick="light">Light</button><button type="button" data-theme-pick="dark">Dark</button></div></div>
            <div><h4>Avatar at work</h4>
              <div class="views" id="avatar-mode" role="group" aria-label="Avatar at work">
                <button type="button" data-avatar-pick="acting" title="Acting out what it does: a book, a magnifying glass, gears…">Acting</button><button type="button" data-avatar-pick="simple" title="Small, moving as its character does">Simple</button></div></div>
            <div><h4>Chat's earlier turns</h4>
              <div class="views" id="chat-earlier" role="group" aria-label="Chat's earlier turns">
                <button type="button" data-earlier-pick="messages" title="Your messages only: a click on one shows the agent's replies">Messages only</button><button type="button" data-earlier-pick="whole" title="Each with the agent's replies: a click on your message folds them">Whole</button></div></div>
            <div><h4>Hook servers</h4><div class="servers" id="servers"></div></div>
          </div>
        </div>
        <span class="list-btns" id="list-btns"></span>
      </div>
    </header>
    <aside id="agents"></aside>
    <!-- the list folded: the actors at work, or wanting the reader, as their avatars; the list over the whole page: every actor -->
    <nav class="rail" id="rail" aria-label="Actors"></nav>
    <div class="monitor" id="monitor" tabindex="-1"></div>
    <div class="side-grip" id="side-grip" role="separator" aria-orientation="vertical" title="Drag to resize · double-click: the width it had first"></div>
  </div>
  <div class="work">
  <div class="top-row" id="top-row"><section class="ed-top" id="ed-top" hidden aria-label="Editor"></section></div>
  <div class="panes" id="panes">
    <section class="pane" id="pane-here">
      <div class="pane-top"><div class="pane-head" id="pane-head">
        <span class="pane-who" id="pane-who"></span>
        <div class="controls" id="controls"></div>
        <button class="pane-close" id="pane-close" type="button" title="Close this pane" aria-label="Close this pane">×</button>
      </div></div>
      <main id="main"><div class="empty">Loading…</div></main>
    </section>
  </div>
  </div>
</div>
<!--VENDOR-->
<script>window.AG_SNAPSHOT = /*SNAPSHOT*/null;</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
