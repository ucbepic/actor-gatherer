<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<title>DocWriter</title>
		<script src="/_ag/app.js"></script>
		<script>
			// Where this DocWriter's requests go (vite.config.mjs): its backend, under /api/w/<gatherer>/<instance> on the
			// app's origin -- named by the query the dashboard opens its panel with, or by its own path (its preview page)
			(function () {
				var m = location.pathname.match(/^\/api\/w\/[^/]+\/[0-9a-f]{16}/), q = new URLSearchParams(location.search);
				globalThis.__dwBase = m ? m[0] : "/api/w/" + encodeURIComponent(q.get("gatherer") || "") + "/" + (q.get("instance") || "");
			})();
		</script>
	</head>
	<style>
		html, body { margin: 0; padding: 0; height: 100%; }
		body { overflow: hidden; }
		/* the model is the actor's; style references are not offered here */
		.model-picker, .reference-pill { display: none !important; }
	</style>
	<body>
		<div id="app" style="display: contents"></div>
		<script type="module" src="./src/main.ts"></script>
	</body>
</html>
