# The harnesses ag can run. Each names its launcher (a Launcher subclass,
# "module:Class") and its adaptor (Python "module:Class", or TypeScript
# "path.ts:Export" relative to this clone), then the launcher's settings. Add
# an entry to run another harness: nothing else in ag changes. Before a run ag
# checks that the event types the adaptor and the gatherer's pollers output are
# all among the policy's, and refuses to run otherwise.

[cli.harnesses.codex]
launcher = "ag.integrations.harnesses.codex.setup.launch:CodexLauncher"   # the launcher class, "module:Class"
adaptor  = "ag.integrations.harnesses.codex.adaptor.adaptor:CodexAdaptor"  # the adaptor class: "module:Class", or "path.ts:Export"
command  = ["codex"]        # the command that runs the harness
provider = ""               # the model provider to hook ("": the one codex would use)
port     = 4013             # the first port a hook server tries
log_dir  = ""               # if set, each request the hook changed, before and after
env      = {}               # extra environment for this harness only

[cli.harnesses.pi]
launcher = "ag.integrations.harnesses.pi.setup.launch:PiLauncher"
adaptor  = "ag/integrations/harnesses/pi/adaptor/adaptor.ts:PiAdaptor"
command  = ["pi"]           # the pi to run
env      = {}               # extra environment for pi

[cli.harnesses.opencode]
launcher = "ag.integrations.harnesses.opencode.setup.launch:OpencodeLauncher"
adaptor  = "ag/integrations/harnesses/opencode/adaptor/adaptor.ts:OpencodeAdaptor"
command  = ["opencode"]     # the opencode to run
env      = {}               # extra environment for opencode

[cli.harnesses.claude]
launcher = "ag.integrations.harnesses.claude.setup.launch:ClaudeLauncher"
adaptor  = "ag.integrations.harnesses.claude.adaptor.adaptor:ClaudeAdaptor"
command  = ["claude"]       # the Claude Code to run
upstream = ""               # where its API calls go ("": ANTHROPIC_BASE_URL as set, else Anthropic's)
port     = 4113             # the first port a hook server tries
log_dir  = ""               # if set, each request the hook changed, before and after
trace_root = ""             # if set, every model call there: the request as the model got it, and its answer
system_messages = ""        # "keep" / "user" for every request ("": chosen by each request's model)
env      = {}               # extra environment for Claude Code (and nothing else)

[cli.harnesses.antigravity]
launcher = "ag.integrations.harnesses.antigravity.setup.launch:AntigravityLauncher"
adaptor  = "ag.integrations.harnesses.antigravity.adaptor.adaptor:AntigravityAdaptor"
command  = ["agy"]          # Antigravity's CLI, run on its Gemini API route (needs GEMINI_API_KEY)
port     = 4213             # the first port a hook server tries
env      = {}               # extra environment for agy (and nothing else)
