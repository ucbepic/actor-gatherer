# The Editor: a folder's files, each text file edited live -- every page with it open, and the file on disk, one more
# of its editors, so what an actor writes to it lands in it as it is written, around what was typed and not saved,
# but for the lines the user is editing (its conflict zone), which an actor's change is asked about -- and any other
# file shown (an image, a PDF, a sound, a video). Its files are the host's, shared live (app_kit.docs: the same
# documents the actors' branches merge into). Beside the file, the project's preview: the command that builds or
# runs it, set by the user or an agent, run by either (Execute, ⌘↵), and what it makes. One per Editor started, on a
# folder, with an agent of its own (started with it), who alone is given its tools and instructions -- as the Browser
# and DocWriter are. Lines selected in a file are sent from there to any actor of the gatherer, with what to do, as the
# user's message (message_actors).
name = "editor"
label = "Editor"
version = "1"
description = "edit a folder's files live, with the actors, and preview what they make"
instances = "many"
offer = "attached"
mark = "mark.svg"
instructions = """You work with the user's Editor, in the dashboard: it edits the files of a folder live, the user and you
together. Change files with its tools -- editor_read, editor_edit (old_string -> new_string, as your own Edit), editor_write
(a whole file) -- not your own edit tools or shell commands: they work on any file, and a file the user has open in the
Editor is changed there, as its mode says. Live (the default): your change shows to the user as it lands and is written
to the file, but one to lines they are editing is held for them to settle. Review: each change is a proposal they accept
or reject in their own time -- propose and carry on with your task, never waiting for them; your next edits build on
your proposals (editor_read shows them in), and the file on disk changes only when they accept. Hands off: do not change
files they have open; ask them first. You are told when they settle a change of yours, and when the mode changes. editor_open shows the user a file, at a line. Beside the file the Editor shows the project's preview -- the
command that builds or runs it, such as a LaTeX build or a dev server -- and what it makes: a file it writes, the page of
a server it starts, or its output. When the user asks for a preview, set it with editor_preview_set (command, and `show`: a path
in the checkout or a URL; {file}, {stem}, {name}, {dir} name the file open in the Editor), and run it with
editor_preview_run, once the user has let that command run: a command you set waits for them to run it in the Editor
first. editor_preview_show says what it is now; editor_preview_stop stops its run. The same from the shell: `ag
preview` (see `ag preview --help`)."""

[agent]
start = true
name = "Editor · {folder}"

[backend]
python = "backend:EditorApp"

[panel]
entry = "panel/index.html"

[capabilities]
docs = true
actors = true
edit_guard = true
message_actors = true

[[tools]]
name = "read"
description = "Read a file as the user's Editor has it: with what they typed and have not saved, if it is open there (in Review, your waiting changes in). Lines numbered, as your own Read."
input_schema = { type = "object", properties = { path = { type = "string", description = "the file: absolute, or from your working directory" }, offset = { type = "integer", description = "the first line (default 1)" }, limit = { type = "integer", description = "how many lines (default 2000)" } }, required = ["path"] }

[[tools]]
name = "edit"
description = "Change a file: old_string, which must be in it once (or replace_all), replaced by new_string -- through the user's Editor if it is open there (shown as it lands, or a proposal for them to review, as its mode says), else on disk."
input_schema = { type = "object", properties = { path = { type = "string", description = "the file: absolute, or from your working directory" }, old_string = { type = "string" }, new_string = { type = "string" }, replace_all = { type = "boolean", description = "every place old_string is (default false)" } }, required = ["path", "old_string", "new_string"] }

[[tools]]
name = "write"
description = "Write a whole file (made if it is not there) -- through the user's Editor if it is open there, as editor_edit, else on disk."
input_schema = { type = "object", properties = { path = { type = "string", description = "the file: absolute, or from your working directory" }, content = { type = "string", description = "the whole file" } }, required = ["path", "content"] }

[[tools]]
name = "open"
description = "Show the user a file in their Editor, at a line: to point them at something."
input_schema = { type = "object", properties = { path = { type = "string" }, line = { type = "integer" } }, required = ["path"] }

[[tools]]
name = "preview_show"
description = "The project's preview (its command and what it shows), and its latest run."
input_schema = { type = "object", properties = { path = { type = "string", description = "a file or folder of the project (default: your working directory)" } } }

[[tools]]
name = "preview_set"
description = "Set the project's preview: a command run through the shell in the checkout, and what it shows."
input_schema = { type = "object", properties = { command = { type = "string", description = "run in the checkout; none: what it shows is shown as it is" }, show = { type = "string", description = "a path in the checkout, or a URL (the command a server); none: its output" }, path = { type = "string", description = "a file or folder of the project (default: your working directory)" } } }

[[tools]]
name = "preview_run"
description = "Run the project's preview now, as the user has let it run; waits `wait` seconds (default 0) for it to end, or its server to answer, and says how it went -- a LaTeX build: its log's errors and warnings too, as `file:line: message` (run.problems)."
input_schema = { type = "object", properties = { file = { type = "string", description = "the file {file} names" }, wait = { type = "number" }, path = { type = "string", description = "a file or folder of the project (default: your working directory)" }, ok = { type = "string", description = "the user's own, from the Editor: the command they let run" } } }

[[tools]]
name = "preview_stop"
description = "Stop the preview's run (its server, if it starts one)."
input_schema = { type = "object", properties = { path = { type = "string" } } }

[[tools]]
name = "preview_clear"
description = "No preview for the project any more."
input_schema = { type = "object", properties = { path = { type = "string" } } }

[[events]]
name = "editor.mode"
description = "The Editor's mode, set: {mode (live, review, handsoff), by}."

[[events]]
name = "editor.preview_set"
properties = ["by"]
description = "A project's preview set: {key (its repository), command, show, by} (by: \"\" the user, else the agent's channel)."

[[events]]
name = "editor.preview_allowed"
description = "A command an agent set, let run by the user: {key, command}."

[[events]]
name = "editor.preview_cleared"
description = "No preview for the project any more: {key}."

[[events]]
name = "editor.preview_ran"
description = "A run, once over: {key, checkout, command, show, by, file, state, code, started, ended}."

# Any file shown, in an Editor open (else a new one, on its folder); an app taking its type, first.
[[handles]]
intent = "open-file"
