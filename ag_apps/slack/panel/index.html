<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slack</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div id="app" class="sk">
  <header class="bar">
    <div class="bar-name"><span class="title">Slack</span><span id="team" class="team"></span></div>
    <div id="filters" class="seg" role="tablist" aria-label="Show">
      <button type="button" role="tab" data-f="recent" aria-selected="true">Recent</button>
      <button type="button" role="tab" data-f="all" aria-selected="false">All</button>
      <button type="button" role="tab" data-f="unread" aria-selected="false">Unread</button>
      <button type="button" role="tab" data-f="mentions" aria-selected="false">Mentions</button>
    </div>
    <label class="find"><span class="sr">Search conversations, or press Enter to search Slack</span>
      <input id="find" type="search" placeholder="Find, or Enter to search Slack (⌘K: jump to)" autocomplete="off">
    </label>
    <div id="agents" class="agents" aria-label="Agents working with Slack"></div>
    <button id="settings-btn" class="icon-btn" type="button" aria-label="Slack settings" aria-expanded="false"></button>
  </header>

  <div id="setup" class="setup" hidden></div>

  <div id="body" class="body" hidden>
    <nav id="side" class="side" aria-label="Conversations">
      <div id="convs" class="convs"></div>
      <div id="status" class="status" aria-live="polite"></div>
    </nav>
    <div id="side-split" class="split" role="separator" aria-orientation="vertical" aria-controls="side" tabindex="0"
         aria-label="Resize the conversations list" title="Drag to resize; double-click to reset"></div>
    <main id="main" class="main">
      <div id="conv-head" class="conv-head"></div>
      <div id="scroll" class="scroll">
        <div id="older" class="older" hidden></div>
        <div id="log" class="log" role="log" aria-live="polite" aria-relevant="additions"></div>
        <div id="here-drafts" class="drafts"></div>
      </div>
      <button id="jump" class="jump" type="button" hidden></button>
      <div id="sched" class="scheds" hidden></div>
      <div id="composer" class="composer"></div>
      <div id="results" class="results" hidden></div>
      <div id="empty" class="empty" hidden></div>
    </main>
    <div id="thread-split" class="split" role="separator" aria-orientation="vertical" aria-controls="thread" tabindex="0"
         aria-label="Resize the thread" title="Drag to resize; double-click to reset" hidden></div>
    <aside id="thread" class="thread" aria-label="Thread" hidden></aside>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="pop" class="pop" hidden></div>
  <div id="switch" class="switch" hidden></div>
  <div id="say" class="say" role="status" aria-live="polite" hidden></div>
</div>
<script src="/_ag/app.js"></script>
<script src="panel.js"></script>
</body>
</html>
