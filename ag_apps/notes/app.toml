# A notebook per gatherer -- pages of to-dos, lists and notes, a minimal Notion -- that the user writes in its panel and
# their agents read and change with its tools. Kept in a file of the app's data folder (backend.py), not as events:
# the user's typing is many small changes, each kept at once.
name = "notes"
label = "Notes"
version = "1"
description = "pages of to-dos, lists and notes"
instances = "one"
mark = "mark.svg"
instructions = """Notes is the user's notebook for this gatherer, which they keep in the dashboard: pages of to-dos,
lists and notes (pages can sit under other pages). When the user mentions their notes, to-dos, lists or a page of
theirs, read it with notes_read (no `page`: the pages; with one: its blocks as markdown, each line its block's id
first). Add with notes_add -- markdown lines to a page, or `title` for a new page -- and change a block (tick a to-do,
rewrite or delete it), or a page's title, with notes_change. Change the notebook only when the user asks you to; they
see your changes at once. A line can link to another page, as `[its title](page:<its id>)` (the id from notes_read):
the user clicks it to open that page, and it follows the page's renames. When a line names one of the pages, link it.

When what you write sums up what came out of your own conversation with the user -- what you found, worked out,
answered or decided with them -- pass `from_conversation` true to notes_add or notes_change: the lines then name you as
their source, and the user can follow up on them with you from the page. Leave it out when you only put down what the
user told you to, in their words or close to them (a to-do they named, a line they dictated), and when you tick or
tidy lines. A follow-up starts "(A reply in my Notes, page ..., block <id>: about a line you wrote there ...)": answer
it as always, then put one to three lines beside that line with notes_report -- about several lines, one report, on the
block it says.

The user can also send you a line of their notes, as their message to you: it starts with a note in parentheses,
"(From my Notes, page ..., block <id>. ...)", then the line and any instructions they added; "(A reply in my Notes,
...)" starts their message about a line they sent you before. Several lines sent together name each of them, "blocks
<id>, <id>, ...", in the order the lines follow the note, as markdown: one job, but each line its own report. Do what
it asks. When it asks you to write something in
the notes (a bullet, a to-do, a summary, a list), write it on the page itself with notes_add -- after that line, its id
as `after` -- or notes_change. When you are done, or can't do it, and the note asks you to report back, report with
notes_report: one to three lines on what you did and where it is, not your whole answer -- `done` true if you finished
what the line asks, and in `results` what you made (files, a branch, a PR); for several lines, a report on each. A
report goes into that line's conversation, beside the page, not on the page: it is never how you write in the notes.
Your answer itself goes as always.

A line sent to you is one of the user's work items, and only the user says when one is done: they review your report
and accept it, or send it back with what is left (a reply). Never tick or end a work item yourself. A line may go to
other agents too: report on your part of it. A note saying the user canceled a line, or took it back from you, means:
stop any work on it, and don't report on it."""

[asked]
when = 'my Notes, page "'
pattern = '^(?=\((?:From|A reply in) my Notes, page "(?:[^"\\]|\\.)*", blocks? [a-z0-9]+[^)]*\)\s*([\s\S]*)$)\((?:From|A reply in) my Notes, page "((?:[^"\\]|\\.)*)", blocks? ([a-z0-9]+(?:, [a-z0-9]+)*)'
otherwise = "A line from the notes"

[capabilities]
actors = true
message_actors = true

[backend]
python = "backend:NotesApp"

[panel]
entry = "panel/index.html"

[[tools]]
name = "read"
description = "The notebook's pages (no `page`), or one page: its blocks as markdown, each line its block's id first, as [id]."
input_schema = { type = "object", properties = { page = { type = "string", description = "a page's id or title" } } }

[[tools]]
name = "add"
description = "Add markdown to a page (each line a block: `- [ ] ` to-do, `- ` or `1. ` list, `# ` heading, `> ` quote, ``` code, `---`; two spaces in, a level in; a link to another page: `[its title](page:<its id>)`), or make a new page with `title`."
input_schema = { type = "object", properties = { markdown = { type = "string", description = "the blocks to add, as markdown lines" }, page = { type = "string", description = "the page to add to: its id or title" }, title = { type = "string", description = "instead of `page`: a new page with this title" }, parent = { type = "string", description = "for a new page: the page it goes under (id or title)" }, icon = { type = "string", description = "for a new page: an emoji" }, after = { type = "string", description = "the block's id to add after, or \"start\"; default the end" }, from_conversation = { type = "boolean", description = "true when the lines sum up what came out of your own conversation with the user (not words they told you to put down): they then name you as their source" } }, required = ["markdown"] }

[[tools]]
name = "change"
description = "Change one block of a page -- what it says (`markdown`, which may be several lines), a to-do ticked (`checked`), or `delete` -- or, with no `block`, the page's title, icon, parent, or the page itself into the trash (`delete`)."
input_schema = { type = "object", properties = { page = { type = "string", description = "the page: its id or title" }, block = { type = "string", description = "the block's id, from notes_read" }, markdown = { type = "string", description = "what the block becomes (\"\" deletes it)" }, checked = { type = "boolean", description = "a to-do ticked, or not" }, delete = { type = "boolean" }, title = { type = "string" }, icon = { type = "string" }, parent = { type = "string", description = "the page it goes under (id or title), or \"top\"" }, from_conversation = { type = "boolean", description = "with `markdown`: true when what the block becomes sums up what came out of your own conversation with the user (not words they told you to put down): it then names you as its source" } }, required = ["page"] }

[[tools]]
name = "report"
description = "Report back on a block of the user's notes they sent you (its message began \"(From my Notes, page ..., block <id>. ...)\", or named several, \"blocks <id>, <id>\": a report on each): one to three lines on what you did and where it is, into the conversation about that line (beside the page, not on it: write on the page with notes_add). The user reviews it and says when the line is done."
input_schema = { type = "object", properties = { block = { type = "string", description = "the block's id, from the note at the start of the user's message" }, text = { type = "string", description = "your report: one to three lines" }, done = { type = "boolean", description = "you finished what the line asks (false: you stopped short, or need something from the user)" }, results = { type = "array", items = { type = "string" }, description = "what you made, each short: a file's path, a branch, a PR's link" } }, required = ["block", "text"] }
